<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <main class="game-container">
        
        <header class="game-header">
            <h1>Monster Mayhem</h1>

            <p class="subtitle">
                
            </p>
        </header>
        <section class="instructions-card">
            <h2>How to play</h2>
            <p>
                Hober over a hexagon to highlight it. Click a hexagon to select it
                Click the same hexagon again to deselect it.
            </p>
        </section>

        <section class="game-info">
            <div class="info-box">
                <span class="info-label">Selected Hexagon</span>
                <span id="selectedHex" class="info-value">None</span>
            </div>
            
            <div class="info-box">
                <span class="info-label">Monster Position</span>
                <span id="monsterPosition" class="info-value">1, 1</span>
            </div>

            <button id="resetButton" class="reset-button">
                Reset game
            </button>
        </section>

        <section class="board-area">
            <h2 class="board-title">Game Board</h2>
        <section id="board" class="hex-board">

        <!-- The 10x10 hexagon board will be created here using JavaScript -->
        </section>

    </section>
        
        <p id="gameMessage" class="game-message">
            Select a hexagon to begin.
        </p>

    </main>
    
    <script src="script.js"></script>
</body>
</html>
